<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elessar Pitch Teleprompter</title>
<style>
  :root{
    --bg:#f6f2e8;
    --panel:#fffdf7;
    --ink:#070707;
    --red:#c40000;
    --muted:rgba(7,7,7,.48);
    --line:rgba(7,7,7,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}
  body{display:grid;place-items:center}
  .app{width:100vw;height:100vh;padding:18px 24px;display:grid;grid-template-rows:auto 10px 1fr auto;gap:12px}
  .top{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px}
  .brand{font-family:"Arial Black",Arial,sans-serif;font-size:clamp(20px,2vw,34px);letter-spacing:-.05em;text-transform:uppercase}.brand span{color:var(--red)}
  .total{text-align:center}.totalTime{font-family:"Arial Black",Arial,sans-serif;font-size:clamp(64px,8vw,132px);line-height:.78;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.totalTime.warn{color:var(--red)}
  .label{margin-top:7px;color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
  .meta{text-align:right;font-weight:900;font-size:clamp(20px,2.2vw,36px);line-height:1}.meta b{color:var(--red);font-family:"Arial Black",Arial,sans-serif}.meta small{display:block;color:var(--muted);font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin-top:7px}
  .bar{height:10px;background:rgba(0,0,0,.13);border-radius:99px;overflow:hidden}.bar div{height:100%;width:0;background:var(--red);transition:width .2s linear}
  .card{min-height:0;background:var(--panel);border:2px solid var(--ink);border-radius:26px;box-shadow:9px 9px 0 var(--ink);padding:22px;display:grid;grid-template-rows:auto auto 1fr;gap:14px}
  .slideHead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}.slideHead h1{font-family:"Arial Black",Arial,sans-serif;font-size:clamp(38px,5vw,82px);line-height:.86;letter-spacing:-.06em;text-transform:uppercase}.slideHead h1 small{display:block;color:var(--red);font-size:.4em;letter-spacing:-.03em;margin-bottom:7px}.slideTime{font-family:"Arial Black",Arial,sans-serif;color:var(--red);font-size:clamp(48px,6vw,96px);line-height:.8;letter-spacing:-.07em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .signal{border:2px solid var(--red);border-radius:18px;padding:12px 16px;color:var(--red);font-weight:900;font-size:clamp(18px,1.8vw,28px);line-height:1.12;background:#fff}
  .script{min-height:0;overflow-y:auto;scrollbar-width:thin;padding:4px 12px 6px 2px;display:flex;flex-direction:column;gap:13px}
  .script::-webkit-scrollbar{width:10px}.script::-webkit-scrollbar-thumb{background:var(--red);border-radius:99px}.script::-webkit-scrollbar-track{background:rgba(0,0,0,.08);border-radius:99px}
  .line{font-size:clamp(24px,2.65vw,46px);line-height:1.14;letter-spacing:-.025em;font-weight:900}.say{color:var(--ink)}.say:before,.say:after{content:'"'}.cue{color:var(--red);font-size:clamp(20px,2.1vw,34px);line-height:1.1}
  .bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-weight:900;font-size:14px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:9px 15px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}.btn.red{background:var(--red);color:#fff}.finish{display:none;height:100%;place-items:center;text-align:center;font-family:"Arial Black",Arial,sans-serif;font-size:clamp(62px,9vw,150px);line-height:.88;text-transform:uppercase}.finish span{color:var(--red)}
  @media(max-width:900px){.app{padding:12px;gap:9px}.top{grid-template-columns:1fr auto}.total{grid-column:1/3;grid-row:2;text-align:left}.meta{text-align:right}.card{padding:16px}.slideHead h1{font-size:42px}.line{font-size:28px}.cue{font-size:23px}.bottom{font-size:12px}.buttons .btn{padding:8px 11px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Elessar <span>Teleprompter</span></div>
    <div class="total"><div class="totalTime" id="totalTimer">2:58</div><div class="label">Auto timer · use arrows if pace changes</div></div>
    <div class="meta"><b id="slideId">00</b> / 07 <small id="slideName">The silence</small></div>
  </header>
  <div class="bar"><div id="progress"></div></div>
  <main class="card">
    <div class="slideHead"><h1 id="title"></h1><div class="slideTime" id="slideTimer">0:10</div></div>
    <div class="signal" id="signal"></div>
    <div class="script" id="script"></div>
    <div class="finish" id="finish">Thank <span>you.</span></div>
  </main>
  <footer class="bottom">
    <div>Black = say it · Red = signal/stage direction · Scroll inside script if needed</div>
    <div class="buttons"><button class="btn red" id="play">Pause</button><button class="btn" id="prev">← Prev</button><button class="btn" id="next">Next →</button><button class="btn" id="reset">Reset</button></div>
  </footer>
</div>
<script>
const slides=[
{id:'00',name:'The silence',seconds:10,signal:'Dead still. Black screen. Say absolutely nothing.',lines:[['cue','Dead stillness. Black screen. Say absolutely nothing. Count to 4 in your head slowly.'],['say','That is how long it takes one hospital department to lose 300,000 forints.'],['cue','One beat. Then:'],['say','We timed it.'],['cue','Advance slide immediately.']]},
{id:'01',name:'The wound',seconds:21,signal:'✓ Problem · IBRAHIM',lines:[['say','Every hospital in Hungary produces millions of rows of clinical and financial data every month into legacy SQL databases, Medworks, and CSV dumps.'],['say','The data collection systems function well. But here is the problem: the exported data is completely unstructured and unused.'],['say','The money is not lost because the hospital systems are broken. It is lost because no one translates raw infos into actionable procurement visibility.']]},
{id:'02',name:'The number',seconds:32,signal:'✓ Target Market · ✓ Market Size',lines:[['say','We built a financial and procurement model using Semmelweis University\'s public data.'],['say','In just one single clinical department, we uncovered enormous amounts locked away in hidden deficits and severe vendor SKU fragmentation.'],['say','Our initial target market is Hungary, with 163 hospitals. If this pattern holds across our target area, the localized market size of institutional data waste scales directly to roughly 8 billion forints annually.'],['say','From there, our broader target market expands straight into Central and Eastern Europe—encompassing over 2,500 regional hospitals.']]},
{id:'03',name:'The insight',seconds:25,signal:'✓ Solution · ✓ USP',lines:[['say','Our solution points where legacy platforms fail at. Our core Unique Selling Proposition is a dual-view analytics system powered by a single, unified clinical ontology.'],['say','A hospital CFO and a Procurement Analyst need completely different answers from the exact same database.'],['say','The CFO needs to quickly access strategic insights; an analyst needs to track equipment lifecycle costs and optimize batches.'],['say','Generic tools force you to choose one or build a custom setup. We built one which delivers both views, from one single data upload.']]},
{id:'04',name:'The proof',seconds:25,signal:'✓ Competitors · IBRAHIM · Let them scan at the end.',lines:[['say','Traditional database enterprise competitors like SAP or Oracle require massive custom engineering teams and slow, 18-month IT integration projects just to comprehend localized hospital billing infrastructure.'],['say','We work completely out of the box.'],['say','Scan the code visible right now to look at our live product platform. It features proprietary clinical mapping validated by healthcare domain experts. It is fully operational right now on synthetic data calibrated from real hospital financial parameters.'],['cue','Hold for 4 seconds. Stay quiet. Let them scan.']]},
{id:'05',name:'The engine',seconds:28,signal:'✓ Business Model · ✓ Go-To-Market Strategy',lines:[['say','The technical engine operates via four seamless steps: Extract, Unify, Compute, and Act.'],['say','Our business model is a straight B2B SaaS subscription model charged per hospital node, ensuring recurring software margins.'],['say','Our go-to-market strategy avoids cold-door enterprise sales. Instead, we are fast-tracking adoption by leveraging pre-existing hospital system integrations and long-standing enterprise relationships via our strategic partner network at ÉPC-Honvédkórház, allowing quick pilot deployments.']]},
{id:'06',name:'Why us. Why now.',seconds:27,signal:'✓ Team Introduction · ✓ Missing Competencies',lines:[['say','Global software companies won\'t build this because it requires deep, localized domain knowledge. We already did the heavy lifting.'],['say','My name is Szabolcs. With my co-founders, who bring extensive backgrounds from data sciences to security, we tried to build an engine from scratch.'],['say','But we have missing competencies. To scale, we need specialized clinical ontologists and dedicated backend engineers, so for fundraising: personnel, operational and setup costs for 18 months of operational runway to secure these precise hires and capture this window.']]},
{id:'07',name:'The hold',seconds:10,signal:'Final line. Stop after thank you.',lines:[['say','The validation window is open right now. 163 hospitals. One single truth. Thank you.']]}
];
const total=slides.reduce((a,s)=>a+s.seconds,0);let running=true,start=Date.now(),offset=0,paused=0,current=-1;
const $=id=>document.getElementById(id);function fmt(x){x=Math.max(0,Math.ceil(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}
function elapsed(){return running?(Date.now()-start)/1000+offset:paused}
function pos(t){let acc=0;for(let i=0;i<slides.length;i++){if(t<acc+slides[i].seconds)return {i,inside:t-acc,acc};acc+=slides[i].seconds}return {i:slides.length,inside:0,acc:total}}
function showSlide(i,inside){const s=slides[i];if(current!==i){current=i;$('script').scrollTop=0;$('finish').style.display='none';$('script').style.display='flex';$('slideId').textContent=s.id;$('slideName').textContent=s.name;$('title').innerHTML='<small>Slide '+s.id+'</small>'+s.name;$('signal').textContent=s.signal;$('script').innerHTML=s.lines.map(([type,text])=>'<p class="line '+type+'">'+text+'</p>').join('')} $('slideTimer').textContent=fmt(s.seconds-inside)}
function tick(){const t=Math.min(elapsed(),total),p=pos(t);$('totalTimer').textContent=fmt(total-t);$('totalTimer').classList.toggle('warn',total-t<=20);$('progress').style.width=(t/total*100)+'%';if(p.i>=slides.length){$('script').style.display='none';$('signal').textContent='Finished. Stop speaking.';$('title').innerHTML='';$('slideTimer').textContent='0:00';$('finish').style.display='grid'}else showSlide(p.i,p.inside);requestAnimationFrame(tick)}
function jump(i){i=Math.max(0,Math.min(slides.length-1,i));offset=slides.slice(0,i).reduce((a,s)=>a+s.seconds,0);start=Date.now();paused=offset;running=true;$('play').textContent='Pause'}
function pausePlay(){if(running){paused=elapsed();running=false;$('play').textContent='Play'}else{offset=paused;start=Date.now();running=true;$('play').textContent='Pause'}}
function reset(){offset=0;paused=0;start=Date.now();running=true;current=-1;$('play').textContent='Pause'}
$('play').onclick=pausePlay;$('reset').onclick=reset;$('prev').onclick=()=>jump((pos(elapsed()).i||0)-1);$('next').onclick=()=>jump(pos(elapsed()).i+1);
document.addEventListener('keydown',e=>{const i=pos(elapsed()).i;if(e.code==='Space'){e.preventDefault();pausePlay()}if(e.key==='ArrowRight')jump(i+1);if(e.key==='ArrowLeft')jump(i-1);if(e.key==='r'||e.key==='R')reset()});tick();
</script>
</body>
</html>
